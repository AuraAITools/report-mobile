  getInstitution(institutionId: ID!): InstitutionResponse!
  getInstitutionsByIds(institutionIds: [ID!]!): [InstitutionResponse!]!
  getLessonById(lessonId: ID!): LessonResponse!
  getLevelByIdInInstitution(institutionId: ID!, levelId: ID!): LevelResponse!
  getLevelByPage(after: String, before: String, first: Int, institutionId: ID!, last: Int, search: LevelSearchInput, sort: SortInput): LevelResponseConnection!
  getLevelsInInstitution(institutionId: ID!): [LevelResponse!]!
  getMaterialById(institutionId: ID!, materialId: ID!): MaterialResponse!
