  createParentInAccount(createParentInAccountInput: CreateParentInAccountInput!): ParentResponse!
  createSchoolInInstitution(createSchoolInput: CreateSchoolInput!): SchoolResponse!
  createStudentsInAccount(createStudentsInput: CreateStudentsInput!): [StudentResponse!]!
  createSubject(createSubjectInput: CreateSubjectInput!): SubjectResponse!
  createSubjectTopicLinks(createSubjectTopicLinksInput: CreateSubjectTopicLinksInput!): SubjectResponseWithTopics!
