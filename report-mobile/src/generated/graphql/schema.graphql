  deleteLessonById(id: ID!): Boolean!
  deleteLevelById(id: ID!): Boolean!
  deleteMaterialById(deleteMaterialByIdInput: DeleteMaterialByIdInput!): Boolean!
  deleteOutletById(id: ID!): Boolean!
  deleteOutletRoomById(deleteOutletRoomByIdInput: DeleteOutletRoomByIdInput!): Boolean!
  deleteParentById(input: DeleteParentByIdInput!): Boolean!
  deleteSchoolInInstitution(deleteSchoolInInstitutionInput: DeleteSchoolInInstitutionInput!): Boolean!
  deleteStudentById(input: DeleteStudentByIdInput!): Boolean!
  deleteSubjectById(id: ID!): Boolean!
  deleteTopicById(id: ID!): Boolean!
  enableAccountFeature(enableAccountFeatureInput: EnableAccountFeatureInput!): AccountResponse!
  grantUserGroupRole(input: GrantUserGroupRoleInput!): Boolean!
  requestAccountProfileImageUpload(input: RequestAccountProfileImageUploadInput!): AccountProfileImageUploadResponse!
